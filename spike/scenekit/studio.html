<!doctype html>
<!--
  studio.html — the app's 3D viewport (web/ embeds it in an <iframe sandbox="allow-scripts">, NO allow-same-origin:
  builder-written scene code runs here with an opaque origin, so it cannot reach the app, its cookies or storage).
  Same renderer as the bench (viewer-core.js). The app drives it only by postMessage; every reply echoes the request id:
    {type:'load', code}                         → {result}            rebuild the set from the code so far (batch by batch)
    {type:'mode', mode:'lit'|'clay'}            → {}
    {type:'view', cam?}                         → {}                  look through a scene camera (or frame the set)
    {type:'interactive', on}                    → {}                  orbit controls + live render
    {type:'prompt', cam, move, n, i?}           → {prompt, visible}   render prompt for frame i (default 0; prompt-compiler.js)
    {type:'frames', cam, move, n, fps, w, h, mode, start, count, quality} → {frames:[ArrayBuffer JPEG]}  (transferred)
    {type:'still', cam, move, n, w, h, mode}    → {frame: ArrayBuffer PNG}   frame 0 at full quality (look still input)
    {type:'glb', as?: 'lit'|'clay'}             → {glb: ArrayBuffer} (transferred)   lit = materials + JPEG textures
    {type:'play', cam, move, n, fps}            → {} when done; posts {type:'tick', i, n} per frame (timeline playhead)
    {type:'stop'}                               → {}                  stops a running play
    {type:'thumb', cam}                         → {frame: ArrayBuffer JPEG 480×270}
    {type:'exec', code}                         → {ok, stats, cameras, error?}  run extra blocks on the live set (no reload)
    {type:'select', name|null}                  → {info}              selection box + gizmo
    {type:'gizmo', mode:'translate'|'rotate'|'scale'|null} → {}
    {type:'objects'}                            → {objects:[{name, category, triangles}]}
    {type:'viewState'}                          → {pos, target, fov}  the orbit view (add camera here / place new things)
    {type:'models', items:[{id, glb, height}]}  → {}                  GLB bytes for kit.model() (library / imported), parsed once
  Events posted by the viewport: {type:'picked', info|null} (click in the view), {type:'edited', name, pos, rot, scale}
  (gizmo drag finished — the app records it as a kit.edit line).
-->
<html><head><meta charset="utf-8"><title>Studio viewport</title>
<style>html,body{margin:0;height:100%;background:#0d0f12;overflow:hidden}canvas{display:block;width:100%!important;height:100%!important;object-fit:contain}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.186.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.186.1/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Only run as the app's SANDBOXED viewport: an opaque origin means scene code cannot reach the app. Opened directly or
// framed without the sandbox, the page does nothing (security review 10-28). The app's origin is this file's URL origin.
if (self.origin !== 'null') { document.body.textContent = 'studio.html only runs inside the app.'; throw new Error('not sandboxed'); }
const APP_ORIGIN = new URL(location.href).origin;
const base = new URL('.', import.meta.url).href;
const { createViewer, convertFBX } = await import(new URL('viewer-core.js', base).href);
const { compilePrompt, MOVE_PHRASE } = await import(new URL('prompt-compiler.js', base).href);
const VIEW = [1280, 720];
const v = await createViewer({ width: VIEW[0], height: VIEW[1], base });
let interactiveOn = false, playing = false;
const reply = (id, body, transfer = []) => parent.postMessage({ id, ...body }, APP_ORIGIN, transfer);
const blob2buf = (canvas, type, q) => new Promise(res => canvas.toBlob(b => b.arrayBuffer().then(res), type, q));
const okCam = (c) => typeof c === 'string' && /^CAM_[A-Za-z0-9_]{1,60}$/.test(c);
const okMove = (m) => typeof m === 'string' && m.split('+').every(s => s.split(':')[0] in MOVE_PHRASE);

/** Render frames [start, start+count) of a move at w×h, then restore the viewport. Returns JPEG/PNG ArrayBuffers. */
// `mime`, not `type`: callers spread the message ({...m}), whose own `type` ('frames') would replace it — toBlob then
// silently fell back to PNG (~2 MB per lit frame, broke uploads and ffmpeg, 10-28).
// Captures resize the live canvas to the frame size; without a cover the page showed that small picture stretched
// (a blocky flash after every edit, when camera thumbnails refresh — audit 10-29). The cover is a full-size copy of the
// live view, shown during a capture and removed once the live view has redrawn at its own size.
const cover = document.createElement('canvas');
cover.style.cssText = 'position:fixed;inset:0;display:none;pointer-events:none;z-index:5';
document.body.appendChild(cover);
function freeze() {
  v.renderView(); cover.width = v.canvas.width; cover.height = v.canvas.height;
  cover.getContext('2d').drawImage(v.canvas, 0, 0); cover.style.display = 'block';
}
const thaw = () => requestAnimationFrame(() => requestAnimationFrame(() => { cover.style.display = 'none'; }));
async function renderFrames({ cam, move, n, fps = 24, w, h, mode, start = 0, count = 1, mime = 'image/jpeg', quality = 0.92 }) {
  const wasInteractive = interactiveOn; if (wasInteractive) { freeze(); v.interactive(false); }
  v.setSize(w, h); v.setMode(mode);
  await v.texturesSettled();
  const out = [];
  let prevBlack = start > 0 ? null : 0;
  for (let i = start; i < Math.min(n, start + count); i++) {
    v.frame(cam, move, i, n, 1, fps);
    // A failed capture (mostly pure black while the frame before was not, or unknown at a batch start) is rendered once
    // more; a scene that really is black (space) stays black and costs only that one retry per batch.
    let b = v.blackness(); if (b > 0.6 && (prevBlack === null || prevBlack < 0.2)) { v.frame(cam, move, i, n, 1, fps); b = v.blackness(); }
    prevBlack = b; out.push(await blob2buf(v.canvas, mime, quality));
  }
  v.setSize(...VIEW); v.setMode('lit');
  if (wasInteractive) { v.interactive(true); v.renderView(); thaw(); } else v.shot(v.cameras[0] || 'overview');
  return out;
}

addEventListener('message', async (ev) => {
  if (ev.source !== parent || ev.origin !== APP_ORIGIN) return;   // only the app that framed us
  const m = ev.data || {}; const id = m.id;
  try {
    switch (m.type) {
      case 'load': {
        // keepView: a reload of the SAME scene after an edit / chat change / undo keeps where the user is looking (the
        // fresh overview of a reload put interior views outside the room, 10-29 audit). Needs a set already shown.
        const keep = m.keepView && v.result?.stats?.objects > 0 ? v.viewState() : null;
        const r = v.load(String(m.code || ''));
        await v.texturesSettled(); if (!interactiveOn) v.shot(r.cameras[0] || 'overview');
        if (keep) v.setView(keep); else v.frameView();
        return reply(id, { result: r });
      }
      case 'mode': v.setMode(m.mode === 'clay' ? 'clay' : 'lit'); if (!interactiveOn) v.shot(v.cameras[0] || 'overview'); return reply(id, {});
      case 'view': v.frameView(okCam(m.cam) ? m.cam : undefined); if (!interactiveOn) v.shot(okCam(m.cam) ? m.cam : 'overview'); return reply(id, {});
      case 'interactive': interactiveOn = !!m.on; v.interactive(interactiveOn); return reply(id, {});
      case 'prompt': {
        if (!okCam(m.cam) || !okMove(m.move)) throw new Error('bad camera or move');
        const vis = v.visible(m.cam, m.move, Math.max(0, Math.min((m.n | 0) - 1, m.i | 0)), m.n);   // i = first frame of a long-shot segment
        return reply(id, { prompt: compilePrompt(v.result.meta, vis, m.move), visible: vis.slice(0, 15) });
      }
      case 'frames': {
        if (!okCam(m.cam) || !okMove(m.move)) throw new Error('bad camera or move');
        const frames = await renderFrames({ ...m, count: Math.min(64, m.count || 1) });
        return reply(id, { frames }, frames);
      }
      case 'still': {
        if (!okCam(m.cam) || !okMove(m.move)) throw new Error('bad camera or move');
        const [frame] = await renderFrames({ ...m, start: 0, count: 1, mime: 'image/png' });
        return reply(id, { frame }, [frame]);
      }
      case 'glb': {   // decoded here and transferred: a lit set with textures is tens of MB
        const s = atob(await v.exportGLB(m.as === 'clay' ? 'clay' : 'lit')), glb = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) glb[i] = s.charCodeAt(i);
        return reply(id, { glb: glb.buffer }, [glb.buffer]);
      }
      case 'play': {
        // Real-time preview of a camera move in the viewport (timeline playhead). Posts {type:'tick', i, n} while
        // playing; replies when done or stopped. Uses the scene's lit look at the viewport size.
        if (!okCam(m.cam) || !okMove(m.move)) throw new Error('bad camera or move');
        const wasInteractive = interactiveOn; if (wasInteractive) v.interactive(false);
        v.seek(null); playing = true; const fps = m.fps || 24, n = m.n, t0 = performance.now();
        await new Promise((done) => {
          const step = () => {
            const i = Math.min(n - 1, Math.floor((performance.now() - t0) / 1000 * fps));
            v.frame(m.cam, m.move, i, n, 1, fps);
            parent.postMessage({ type: 'tick', i, n }, APP_ORIGIN);
            if (!playing || i >= n - 1) return done();
            requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        });
        playing = false; if (wasInteractive) v.interactive(true);
        return reply(id, {});
      }
      case 'stop': playing = false; return reply(id, {});
      case 'fbx': {   // an imported FBX (Mixamo) → GLB with its motions; the app then stores it like any imported GLB
        if (!(m.data instanceof ArrayBuffer)) throw new Error('no FBX data');
        const r = await convertFBX(m.data); return reply(id, r, [r.glb]);
      }
      case 'seek': {   // park the timeline at frame i (i = null: unpark); replies with the camera state there
        if (m.i !== null && (!okCam(m.cam) || !okMove(m.move))) throw new Error('bad camera or move');
        return reply(id, { state: v.seek(m.cam, m.move, m.i === null ? null : m.i | 0, m.n, 1, m.fps || 24) });
      }
      case 'exec': return reply(id, v.exec(String(m.code || '')));
      case 'models': {   // [{id, glb: ArrayBuffer, height}] for kit.model(); parsed once
        for (const it of (m.items || []).slice(0, 40)) if (typeof it.id === 'string' && it.glb instanceof ArrayBuffer) await v.addModel(it.id, it.glb, it.height);
        return reply(id, {});
      }
      case 'select': return reply(id, { info: v.select(typeof m.name === 'string' ? m.name : null) });
      case 'gizmo': v.setGizmo(['translate', 'rotate', 'scale'].includes(m.mode) ? m.mode : null); return reply(id, {});
      case 'objects': return reply(id, { objects: v.objects() });
      case 'viewState': return reply(id, v.viewState());
      case 'thumb': {
        // Small JPEG of the current set (saved-scene card).
        if (!okCam(m.cam)) throw new Error('bad camera');
        const [frame] = await renderFrames({ cam: m.cam, move: 'static-shot', n: 1, w: 480, h: 270, mode: 'lit', start: 0, count: 1 });
        return reply(id, { frame }, [frame]);
      }
    }
  } catch (e) { reply(id, { error: String(e && e.message || e) }); }
});
v.on('pick', (info) => parent.postMessage({ type: 'picked', info }, APP_ORIGIN));
addEventListener('keydown', (e) => { if (e.key === 'Escape') parent.postMessage({ type: 'key', key: 'Escape' }, APP_ORIGIN); });
v.on('edit', (e) => parent.postMessage({ type: 'edited', ...e }, APP_ORIGIN));
parent.postMessage({ type: 'ready', moves: v.MOVES }, APP_ORIGIN);
</script></body></html>
